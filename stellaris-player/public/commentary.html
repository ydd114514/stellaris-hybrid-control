  const track=$('history-track');track.replaceChildren(...rows.map(x=>{const row=document.createElement('article'),meta=document.createElement('div'),date=document.createElement('time'),kind=document.createElement('span'),text=document.createElement('div');row.className='history-card '+x.type;meta.className='history-meta';date.textContent=x.date||'日期未记录';kind.className='history-kind';kind.textContent=x.type==='plan'?'先前打算':x.category||'星历事件';text.className='history-text';text.textContent=x.text;meta.append(date,kind);row.append(meta,text);return row;}));
  if(!rows.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='下一段行动与星海见闻，会在这里留下记录。';track.append(empty);}$('history-viewport').scrollLeft=0;
}
function autoRead(id,axis,interval){const box=$(id);let pausedUntil=0;for(const event of ['pointerenter','wheel','focusin','pointerdown'])box.addEventListener(event,()=>pausedUntil=Date.now()+20000);box.addEventListener('pointerleave',()=>pausedUntil=Date.now()+3000);setInterval(()=>{if(document.hidden||Date.now()<pausedUntil||box.matches(':hover,:focus-within'))return;const horizontal=axis==='x',size=horizontal?box.clientWidth:box.clientHeight,end=(horizontal?box.scrollWidth:box.scrollHeight)-size,current=horizontal?box.scrollLeft:box.scrollTop;if(end<2)return;const next=current>=end-2?0:Math.min(end,current+size*(horizontal?1:.85));box.scrollTo(horizontal?{left:next}:{top:next});},interval);}
autoRead('chat-list','y',9000);autoRead('history-viewport','x',12000);autoRead('guidance-list','y',10000);
// Frontend-only boundary: Claude's adapter can populate state.audienceGuidance.
// No audience messages are turned into advice or game commands here.
let guidanceKey='';
function renderAudienceGuidance(value){
  const data=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  const labels={disconnected:'待接入',stopped:'场控未启动',waiting:'等候建议',collecting:'整理中',ready:'参考建议',forwarded:'已转交',error:'暂不可用'};
  const status=Object.hasOwn(labels,data.status)?data.status:'disconnected';
  const itemLabels={pending:'待参谋判断',forwarded:'已转交',adopted:'参谋采纳',dismissed:'未采纳',answered:'已回答'};
  const text=(value,max)=>typeof value==='string'?value.slice(0,max):'';
  const rows=(Array.isArray(data.items)?data.items:[]).filter(x=>x&&typeof x.text==='string'&&x.text.trim()).slice(-20);
  const summary=text(data.summary,200),key=JSON.stringify({status,summary,rows});if(key===guidanceKey)return;guidanceKey=key;
  $('guidance-status').textContent=labels[status];$('guidance-status').dataset.status=status;
  $('guidance-summary').textContent=summary;$('guidance-summary').hidden=!summary;
  $('guidance-empty').hidden=!!rows.length;$('guidance-list').hidden=!rows.length;
  $('guidance-list').replaceChildren(...rows.map(x=>{const row=document.createElement('article'),meta=document.createElement('div'),name=document.createElement('span'),badge=document.createElement('span'),content=document.createElement('div');row.className='guidance-row';meta.className='guidance-meta';name.className='guidance-name';name.textContent=text(x.name,60)||'鱼塘建议';badge.className='guidance-item-status';badge.textContent=Object.hasOwn(itemLabels,x.status)?itemLabels[x.status]:'待参谋判断';content.className='guidance-text';content.textContent=text(x.text,1000);meta.append(name,badge);row.append(meta,content);if(text(x.reply,200)){const reply=document.createElement('p');reply.className='guidance-reply';reply.textContent='参谋回复：'+text(x.reply,200);row.append(reply);}return row;}));$('guidance-list').scrollTop=0;
}
function renderNotebook(rows=[]){$('notebook-empty').hidden=!!rows.length;$('notebook-list').hidden=!rows.length;$('notebook-list').replaceChildren(...rows.slice(-3).reverse().map(x=>{const row=document.createElement('div'),meta=document.createElement('div'),date=document.createElement('time'),category=document.createElement('span'),text=document.createElement('div');row.className='note-row';meta.className='note-meta';date.textContent=x.date;category.textContent=x.category;text.className='note-text';text.textContent=x.text;meta.append(date,category);row.append(meta,text);return row;}));}
function renderBalance(b){const value=typeof b?.display==='string'?b.display:'—';$('api-balance-value').textContent=value;$('api-balance-value').classList.toggle('long',value.length>14);$('api-balance').classList.toggle('stale',b?.status==='stale');$('api-balance').title=b?.status==='stale'?'暂未刷新，显示上次查询余额':b?.updatedAt?'DeepSeek 余额 · '+new Date(b.updatedAt).toLocaleTimeString('zh-CN',{hour12:false}):'等待余额查询';}
function render(s){document.getElementById("play-status").textContent=controlStatusText(s.game);$('star-date').textContent=s.game?.date||'—';renderChat(s.audience?.messages);renderNotebook(s.notebook);renderTimeline(s);renderAudienceGuidance(s.audienceGuidance);renderBalance(s.apiBalance);if(preview&&s.previewFrameAt!==frameAt){frameAt=s.previewFrameAt;$('game-preview').src='/preview/game.bmp?v='+(frameAt||0);}}
if(preview){$('game-preview').src='/preview/game.bmp';$('game-preview').onerror=()=>document.body.classList.add('no-picture');$('game-preview').onload=()=>document.body.classList.remove('no-picture');}
const playback=createPlaybackCaptionController({caption:$('caption'),label:$('playback-label'),body:document.body,origin:speechOrigin});
const events=new EventSource('/events');events.onmessage=e=>{document.body.classList.remove('offline');render(JSON.parse(e.data));};events.onerror=()=>document.body.classList.add('offline');
let speechFrame,lastSpeechHeartbeat=0;
function attachSpeech(){if(speechFrame)return;speechFrame=document.createElement('iframe');speechFrame.src=speechOrigin+'/player';speechFrame.title='大肥鱼千问语音';speechFrame.allow='autoplay';speechFrame.style.cssText='position:fixed;width:1px;height:1px;border:0;left:-10px;top:-10px';document.body.append(speechFrame)}
if(!preview&&new URLSearchParams(location.search).get('voice')==='1')attachSpeech();
if(preview){const button=document.createElement('button');button.textContent='试听直播语音';button.onclick=()=>{attachSpeech();button.textContent='语音播放器已接入'};document.querySelector('.preview-controls')?.append(button)}
window.addEventListener('message',event=>{if(event.origin!==speechOrigin||event.source!==speechFrame?.contentWindow||event.data?.source!=='cyberfish-captain-speech')return;if(event.data.heartbeat){lastSpeechHeartbeat=Date.now();return}playback.acceptMessage(event.data);});
setInterval(()=>{if(speechFrame&&Date.now()-lastSpeechHeartbeat>6000)speechFrame.src=speechOrigin+'/player?reconnect='+Date.now()},5000);
$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.origin+'/overlay?voice=1');$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制 OBS 地址',1500);};
window.addEventListener('beforeunload',()=>{events.close();playback.dispose();});
